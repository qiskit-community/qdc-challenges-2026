# Vocabulary for the Tags line of every entry, and the task list of the landing page.
# After editing, run: python3 tools/build_cheatsheet.py

as_of = "2026-11"          # month the cheat sheet was last checked; "New and changing" counts back from it
new_window_months = 6

[documents]
# Order of the documents in the landing page and the versions table.
order = ["reference/qiskit-sdk.md", "reference/ibm-quantum-compute-client.md", "reference/noise-management.md", "reference/qiskit-addons.md", "reference/ibm-quantum-functions-catalog.md", "reference/managed-workflows.md", "reference/simulators.md", "reference/ecosystem.md", "reference/ai-tooling.md", "reference/hardware.md", "guides/getting-started.md", "guides/techniques.md", "guides/testing-and-tips.md", "guides/troubleshooting.md"]

[[family]]
id = "qaoa"
title = "QAOA"
short = "QAOA"
description = "Quantum approximate optimization and its variants: linear-ramp and warm-start QAOA, constraint-preserving mixers, CVaR objectives, and angles trained classically or transferred between instances."

[[family]]
id = "multi-objective"
title = "Multi-objective and constrained optimization"
short = "Multi-objective"
description = "Problems with several objectives or hard constraints: Pareto fronts and their hypervolume, scalarized sub-problems, and constraints evaluated on each candidate solution."

[[family]]
id = "lcu"
title = "LCU and circuit ensembles"
short = "LCU"
description = "Methods that replace one deep circuit by a weighted ensemble of shallower circuits and pay in shots: linear combinations of unitaries sampled term by term, multi-product formulas, quasi-probability decompositions and circuit cutting."

[[family]]
id = "trotter"
title = "Trotterized time evolution"
short = "Trotter"
description = "Hamiltonian simulation of spin and lattice models with Trotter circuits, and the methods that compress, extrapolate or mitigate them."

[[family]]
id = "floquet"
title = "Floquet dynamics"
short = "Floquet"
description = "Periodically driven circuits, which repeat one layer many times, and their long-time, prethermal behavior."

[[family]]
id = "echoes"
title = "Loschmidt echoes and scrambling"
short = "Echoes"
description = "Circuits that evolve forward, apply a small perturbation and evolve backward, such as operator Loschmidt echoes and out-of-time-order correlators, which measure how sensitive an observable is to the perturbation and how fast information spreads."

[[family]]
id = "thermal"
title = "Thermal and dissipative states"
short = "Thermal"
description = "Preparing Gibbs-like or steady states, for example by engineered dissipation with mid-circuit resets, and measuring their observables."

[[family]]
id = "sqd"
title = "Sample-based diagonalization and chemistry"
short = "SQD"
description = "Ground-state energies from sampled configurations (sample-based quantum diagonalization and its Krylov variant), LUCJ circuits, and embedding methods that split large molecules into fragments."

[[family]]
id = "verifiable"
title = "Verifiable circuit sampling"
short = "Verifiable sampling"
description = "Sampling circuits that are hard to simulate and certifying their fidelity, for example by doping checked Clifford circuits with a few non-Clifford gates, estimating fidelity from sampled stabilizers and post-selecting on spacetime checks."

[[family]]
id = "detection"
title = "Error detection and encoded circuits"
short = "Error detection"
description = "Small error-detecting codes and checks that flag errors so that shots can be post-selected, an early step toward fault tolerance."

[[family]]
id = "other"
title = "Other application domains"
short = "Other"
description = "Partial differential equations, classification and finance, reached through application functions."

[[family]]
id = "general"
title = "Used in every family"
short = "General"
description = "Tools that every workflow needs, such as the transpiler, the primitives and QPU budgeting. The family view leaves them out; the workflow view lists them."

[[step]]
id = "map"
title = "Map the problem"
short = "Map"
description = "Turn the problem into circuits and operators: ansatzes, encodings, codes and benchmark circuits."

[[step]]
id = "optimize"
title = "Optimize for the hardware"
short = "Optimize"
description = "Transpile, choose qubits, use native gates, shrink circuits and add error suppression."

[[step]]
id = "execute"
title = "Execute"
short = "Execute"
description = "Run on hardware or simulators: primitives, execution modes, noise learning, QPU-time budgeting and the QPUs themselves."

[[step]]
id = "post-process"
title = "Post-process results"
short = "Post-process"
description = "Turn shots into answers: expectation values, mitigation, post-selection, diagonalization and extrapolation."

[[step]]
id = "scale"
title = "Scale out"
short = "Scale"
description = "Run classical work next to the QPUs with Managed Workflows, and use ready-made functions from the IBM Quantum Functions Catalog."

[[step]]
id = "develop"
title = "Develop and debug"
short = "Develop"
description = "Test locally, simulate, save your work, grade answers and work with AI assistants."

[[noise]]
id = "suppression"
title = "Error suppression"
short = "Suppression"
description = "Reduce errors as the circuit runs: dynamical decoupling, Pauli twirling and shallower circuits."

[[noise]]
id = "characterization"
title = "Noise learning and characterization"
short = "Characterization"
description = "Measure the noise: learned Pauli-Lindblad models, fresh benchmarks and noise-impact estimates."

[[noise]]
id = "detection"
title = "Error detection and post-selection"
short = "Post-selection"
description = "Flag shots hit by an error and discard them."

[[noise]]
id = "mitigation-expval"
title = "Mitigation of expectation values"
short = "Mitigation (expectation values)"
description = "Correct expectation values after the run: TREX, ZNE, PEA, PEC and the methods that cut their cost."

[[noise]]
id = "mitigation-sampling"
title = "Mitigation of sampling results"
short = "Mitigation (sampling)"
description = "Correct counts and sampled configurations: readout mitigation and sample-based diagonalization."

[[runs]]
id = "local"
description = "Runs on your machine without an account"

[[runs]]
id = "account"
description = "Needs an IBM Quantum account but no QPU time"

[[runs]]
id = "qpu"
description = "Uses QPU time"

[[runs]]
id = "serverless"
description = "Runs as a Managed Workflow (Qiskit Serverless), which needs a Premium, Flex or On-Prem plan"

[[runs]]
id = "premium"
description = "Needs a Premium, Flex or On-Prem plan"

[[status]]
id = "stable"
title = "Stable"
description = "Released and supported."

[[status]]
id = "beta"
title = "Beta"
description = "IBM labels it beta; interfaces may change between releases."

[[status]]
id = "alpha"
title = "Alpha"
description = "Early 0.x releases; expect breaking changes."

[[status]]
id = "experimental"
title = "Experimental"
description = "An experimental feature, or a code base its authors call unstable."

[[status]]
id = "preview"
title = "Preview"
description = "A preview service with restricted access."

